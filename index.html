<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Mini Game Zone</h1>

    <p>Choose a game:</p>

    <button onclick="showGame('number')">
        Guess number
    </button>

    <button onclick="showGame('word')">
        word Guess
    </button>

    <button onclick="showGame('ttt')">
        Tic Tac Toe
    </button>

  

    <div id="numberGame">

        <h2>Guess the Number</h2>

        <p>Guess a number from 1 to 100</p>

        <input id="numberInput" type="number">

        <button onclick="guessNumber()">
            Guess
        </button>

        <p id="numberMessage"></p>

        <p>
            Tries:
            <span id="tries">0</span>
        </p>

        <button onclick="newNumberGame()">
            New Game
        </button>

    </div>


     
    <div id="wordGame">

        <h2>Word Guess</h2>

        <p id="wordDisplay"></p>

        <p id="wrongLetters"></p>

        <input
             id="letterInput"
             type="text"
             
        >

        <button onclick="guessLetter()">
            Try
        </button>

        <p id="wordMessage"></p>

        <p>
            Lives:
            <span id="lives">6</span>
        <p>

        <button onclick="newWordGame()">
            New Word
        </button>

    </div>


    

    <div id="tttGame">

        <h2>Tic Tac Toe</h2>

        <p>You are X</p>

        <button onclick="play(0)" id="cell0"></button>
        <button onclick="play(1)" id="cell1"></button>
        <button onclick="play(2)" id="cell2"></button>

        <br>

        <button onclick="play(3)" id="cell3"></button>
        <button onclick="play(4)" id="cell4"></button>
        <button onclick="play(5)" id="cell5"></button>

        <br>


        <button onclick="play(6)" id="cell6"></button>
        <button onclick="play(7)" id="cell7"></butoon>
        <button onclick="play(8)" id="cell8"></button>

        <p id="tttMessage"></p>

        <button onclick="newTTTGame()">
            New Game
        </button>

    </div>

    <button onclick="showGame('coin')">Coin Flip</button>

    <div id="coinGame" class="game-box hidden">
        <h2>Coin Flip</h2>
        
        <img id="coin" src="heads.png" alt="Coin">
        
        <button onclick="flipCoin()">Flip</button>
        <p id="result">Ready?</p>
        <p id="score">Heads: <span id="heads">0</span> | Tails: <span id="tails">0</span></p>
    </div>

    <script src="script.js"></script>





</body>
</html>
